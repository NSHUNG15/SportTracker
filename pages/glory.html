<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition Podium - Final Rankings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .carousel-container {
            overflow: hidden;
            position: relative;
            width: 100%;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-item {
            min-width: calc(100% - 20px); /* Smaller margin on mobile */
            margin: 0 10px;
            flex-shrink: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        @media (min-width: 768px) { /* md breakpoint */
            .carousel-item {
                min-width: calc(100% - 80px); /* Larger margin on larger screens */
                margin: 0 40px;
            }
        }
            #fireworks-canvas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
            }
    </style>
</head>
<body class="min-h-screen text-white font-poppins bg-gradient-to-br from-indigo-900 via-purple-900 to-blue-900">
    <canvas id="fireworks-canvas"></canvas>

    <nav class="sticky top-0 z-50 shadow-xl bg-indigo-950/90 backdrop-blur-md">
        <div class="container px-4 py-3 mx-auto sm:px-6 sm:py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-200 to-purple-200 animate-slide animate-duration-300 sm:text-3xl">
                    SportTracker
                </h1>
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="p-2 text-white transition-all duration-300 rounded-lg hover:bg-indigo-700/50">
                        <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
                <div class="items-center hidden space-x-4 md:flex animate-slide animate-duration-700 animate-delay-200 sm:space-x-6">
                    <a href="./../index.html" class="px-3 py-2 text-sm text-white transition-all duration-300 rounded-lg hover:bg-indigo-600 hover:scale-105 sm:px-4 sm:text-base">Schedule</a>
                    <a href="results.html" class="px-3 py-2 text-sm text-white transition-all duration-300 rounded-lg hover:bg-indigo-600 hover:scale-105 sm:px-4 sm:text-base">Results</a>
                    <a href="admin.html" class="px-3 py-2 text-sm text-white transition-all duration-300 rounded-lg bg-gradient-to-r from-blue-500 to-purple-500 hover:scale-105 sm:px-4 sm:text-base">Admin</a>
                </div>
            </div>
            <div id="mobile-menu" class="hidden mt-3 space-y-2 md:hidden animate-fade animate-duration-500 sm:mt-4 sm:space-y-3">
                <a href="./../index.html" class="block px-4 py-2 text-sm text-white transition-all duration-300 rounded-lg hover:bg-indigo-700/50 sm:text-base">Schedule</a>
                <a href="results.html" class="block px-4 py-2 text-sm text-white transition-all duration-300 rounded-lg hover:bg-indigo-700/50 sm:text-base">Results</a>
                <a href="admin.html" class="block px-4 py-2 text-sm text-white transition-all duration-300 rounded-lg bg-gradient-to-r from-blue-500 to-purple-500 hover:bg-indigo-700/50 sm:text-base">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container px-4 py-8 mx-auto sm:px-6 sm:py-12">
        <h1 class="mb-8 text-3xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 animate-pulse animate-duration-2000 sm:text-4xl md:text-5xl lg:text-6xl">
            Competition Podium
        </h1>
        <div class="flex items-center justify-center space-x-2 sm:space-x-4">
            <button class="flex items-center justify-center w-10 h-10 text-white transition-all duration-300 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 hover:scale-110 hover:shadow-lg sm:w-14 sm:h-14" onclick="rotateCarousel(-1)">
                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div class="relative carousel-container max-w-[80rem]">
                <div id="sport-carousel" class="carousel-track" ></div>
            </div>
            <button class="flex items-center justify-center w-10 h-10 text-white transition-all duration-300 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 hover:scale-110 hover:shadow-lg sm:w-14 sm:h-14" onclick="rotateCarousel(1)">
                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </div>

    <script>
        // Toggle mobile menu
        document.getElementById('mobile-menu-button').addEventListener('click', () => {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });

        // Parse duration to seconds
        function parseTimeToSeconds(timeStr) {
            if (!timeStr) return Infinity;
            const parts = timeStr.split(':');
            if (parts.length === 2) {
                const [minutes, seconds] = parts.map(Number);
                return minutes * 60 + seconds;
            }
            return parseFloat(timeStr);
        }

        // Fetch matches from server
        async function fetchMatches() {
            try {
                const response = await fetch('/matches');
                return await response.json();
            } catch (error) {
                console.error('Error fetching matches:', error);
                return { matches: [] };
            }
        }

        // Get sport emoji icon
        function getSportIcon(sport) {
            switch (sport.toLowerCase()) {
                case 'football': return '⚽';
                case 'badminton': return '🏸';
                case 'chess': return '♟️';
                case 'athletics': return '🏃';
                default: return '🎮';
            }
        }

        // Process podium data
        function processPodiumData(sport, eventType, matches) {
            let first = null, second = null, third = null;

            if (sport === 'Athletics') {
                const relevantMatches = matches
                    .filter(m => m.sport === sport && m.eventType === eventType && m.duration && (m.round === 'Chung Kết' || m.round === 'Tranh Hạng 3'))
                    .map(m => ({
                        name: m.team1,
                        duration: m.duration,
                        eventType: m.eventType,
                        timeInSeconds: parseTimeToSeconds(m.duration),
                        image: './../win.png'
                    }));

                relevantMatches.sort((a, b) => a.timeInSeconds - b.timeInSeconds);

                if (relevantMatches[0]) first = relevantMatches[0];
                if (relevantMatches[1]) second = relevantMatches[1];
                if (relevantMatches[2]) third = relevantMatches[2];
            } else {
                const finalMatch = matches.find(m => m.round === 'Chung Kết' && m.sport === sport && m.eventType === eventType);
                const thirdPlaceMatch = matches.find(m => m.round === 'Tranh Hạng 3' && m.sport === sport && m.eventType === eventType);

                if (finalMatch && finalMatch.score) {
                    const [score1, score2] = finalMatch.score.split('-').map(Number);
                    if (score1 > score2) {
                        first = { name: finalMatch.team1, eventType: finalMatch.eventType, image: './../win.png' };
                        second = { name: finalMatch.team2, eventType: finalMatch.eventType, image: './../win.png' };
                    } else if (score2 > score1) {
                        first = { name: finalMatch.team2, eventType: finalMatch.eventType, image: './../win.png' };
                        second = { name: finalMatch.team1, eventType: finalMatch.eventType, image: './../win.png' };
                    } else {
                        first = { name: `${finalMatch.team1} & ${finalMatch.team2} (Draw)`, eventType: finalMatch.eventType, image: './../win.png' };
                    }
                }
                if (thirdPlaceMatch && thirdPlaceMatch.score) {
                    const [score1, score2] = thirdPlaceMatch.score.split('-').map(Number);
                    if (score1 > score2) {
                        third = { name: thirdPlaceMatch.team1, eventType: thirdPlaceMatch.eventType, image: './../win.png' };
                    } else if (score2 > score1) {
                        third = { name: thirdPlaceMatch.team2, eventType: thirdPlaceMatch.eventType, image: './../win.png' };
                    } else {
                        third = { name: `${thirdPlaceMatch.team1} & ${thirdPlaceMatch.team2} (Draw)`, eventType: thirdPlaceMatch.eventType, image: './../win.png' };
                    }
                }
            }

            return { first, second, third };
        }

        // Render podium
        function renderPodium(sport, eventType, podiumData, panelElement) {
            const podiumElement = panelElement.querySelector('.podium');
            const sportTitle = panelElement.querySelector('.sport-title');
            if (!podiumElement || !sportTitle) return;

            sportTitle.innerHTML = `<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">${getSportIcon(sport)} ${sport} - ${eventType}</span>`;
            sportTitle.classList.add('animate-slide', 'animate-duration-500');
            const { first, second, third } = podiumData;

            podiumElement.innerHTML = `
                <div class="grid w-full grid-cols-1 gap-4 p-4 mt-8 sm:gap-6 md:grid-cols-3 md:gap-8 lg:gap-12 sm:p-6 md:p-8">
                    <!-- Silver (2nd) -->
                    <div class="relative flex flex-col items-center p-4 transition-all duration-300 transform shadow-xl bg-gradient-to-b from-gray-700/80 to-gray-900/80 rounded-2xl hover:scale-105 sm:p-6">
                        <img src="${second ? second.image : ''}" class="absolute object-cover w-16 h-16 border-4 border-gray-300 rounded-full -top-8 sm:w-20 sm:h-20 md:w-24 md:h-24 md:-top-12 animate-bounce animate-duration-1000" alt="Silver medalist" />
                        <div class="flex flex-col items-center justify-end h-40 text-center sm:h-52 md:h-60 ${second ? 'text-white' : 'text-gray-400'}">
                            <p class="mt-12 text-base font-semibold sm:mt-16 sm:text-lg md:text-xl">${second ? second.name : 'N/A'}</p>
                            ${second && sport === 'Athletics' ? `<p class="text-xs text-gray-300 sm:text-sm">${second.duration}</p>` : ''}
                        </div>
                        <div class="flex items-center justify-center w-full h-10 text-base font-bold text-white bg-gray-600/80 rounded-b-xl sm:h-12 sm:text-lg">2nd</div>
                    </div>
                    <!-- Gold (1st) -->
                    <div class="relative flex flex-col items-center order-first p-4 transition-all duration-300 transform shadow-xl bg-gradient-to-b from-yellow-500/80 to-orange-600/80 rounded-2xl hover:scale-105 md:order-none sm:p-6">
                        <img src="${first ? first.image : ''}" class="absolute object-cover w-20 h-20 border-4 border-yellow-300 rounded-full -top-10 sm:w-24 sm:h-24 md:w-28 md:h-28 md:-top-14 animate-bounce animate-duration-1000" alt="Gold medalist" />
                        <div class="flex flex-col items-center justify-end h-48 text-center sm:h-60 md:h-72 ${first ? 'text-white' : 'text-gray-400'}">
                            <p class="text-lg font-semibold mt-14 sm:mt-20 sm:text-xl md:text-2xl">${first ? first.name : 'N/A'}</p>
                            ${first && sport === 'Athletics' ? `<p class="text-xs text-yellow-200 sm:text-sm">${first.duration}</p>` : ''}
                        </div>
                        <div class="flex items-center justify-center w-full h-10 text-base font-bold text-white bg-yellow-600/80 rounded-b-xl sm:h-12 sm:text-lg">1st</div>
                    </div>
                    <!-- Bronze (3rd) -->
                    <div class="relative flex flex-col items-center p-4 transition-all duration-300 transform shadow-xl bg-gradient-to-b from-orange-600/80 to-amber-800/80 rounded-2xl hover:scale-105 sm:p-6">
                        <img src="${third ? third.image : ''}" class="absolute object-cover w-16 h-16 border-4 rounded-full -top-8 sm:w-20 sm:h-20 md:w-24 md:h-24 md:-top-12 border-amber-300 animate-bounce animate-duration-1000" alt="Bronze medalist" />
                        <div class="flex flex-col items-center justify-end h-36 text-center sm:h-48 md:h-56 ${third ? 'text-white' : 'text-gray-400'}">
                            <p class="mt-12 text-base font-semibold sm:mt-16 sm:text-lg md:text-xl">${third ? third.name : 'N/A'}</p>
                            ${third && sport === 'Athletics' ? `<p class="text-xs sm:text-sm text-amber-200">${third.duration}</p>` : ''}
                        </div>
                        <div class="flex items-center justify-center w-full h-10 text-base font-bold text-white bg-amber-700/80 rounded-b-xl sm:h-12 sm:text-lg">3rd</div>
                    </div>
                </div>
            `;
        }

        // State
        const sports = [
            { name: 'Football', icon: '⚽' },
            { name: 'Badminton', icon: '🏸' },
            { name: 'Chess', icon: '♟️' },
            { name: 'Athletics', icon: '🏃' }
        ];
        let matchesData = null;
        let sportEventPairs = [];
        let currentPairIndex = 0;

        // Generate sport-event pairs
        function generateSportEventPairs(matches) {
            const eventTypesBySport = {};
            matches.forEach(match => {
                if (!eventTypesBySport[match.sport]) eventTypesBySport[match.sport] = new Set();
                eventTypesBySport[match.sport].add(match.eventType);
            });

            const pairs = [];
            sports.forEach(sport => {
                const eventTypes = eventTypesBySport[sport.name] ? Array.from(eventTypesBySport[sport.name]) : ['N/A'];
                eventTypes.forEach(eventType => {
                    pairs.push({ sport: sport.name, eventType });
                });
            });
            return pairs;
        }

        // Setup carousel for all sport-event pairs
        async function setupCarousel() {
            const carousel = document.getElementById('sport-carousel');
            carousel.innerHTML = ''; // Clear existing content

            // Create carousel items for each sport-event pair
            sportEventPairs.forEach((pair, index) => {
                const item = document.createElement('div');
                item.className = 'carousel-item bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10';
                item.innerHTML = `
                    <h2 class="pt-6 mb-6 text-xl font-semibold text-center sm:pt-8 sm:mb-8 sm:text-2xl md:text-3xl sport-title"></h2>
                    <div class="w-full pb-6 sm:pb-8 podium"></div>
                `;
                carousel.appendChild(item);

                const panelElement = item;
                const podiumData = processPodiumData(pair.sport, pair.eventType, matchesData.matches);
                renderPodium(pair.sport, pair.eventType, podiumData, panelElement);
            });

            // Set initial position and trigger fireworks
            updateCarouselPosition();
            triggerFireworks();
        }

        // Update carousel position with sliding animation
        function updateCarouselPosition() {
            const carousel = document.getElementById('sport-carousel');
            const containerWidth = document.querySelector('.carousel-container').offsetWidth;
            const itemWidth = document.querySelector('.carousel-item').offsetWidth;
            const margin = window.innerWidth >= 768 ? 40 : 10; // Dynamic margin based on screen size
            const totalItemWidth = itemWidth + 2 * margin; // Total width including margins
            const translateX = -currentPairIndex * totalItemWidth ;
            carousel.style.transform = `translateX(${translateX}px)`;
        }

        // Rotate carousel through sport-event pairs
        function rotateCarousel(direction) {
            if (sportEventPairs.length === 0) return;
            currentPairIndex = (currentPairIndex + direction + sportEventPairs.length) % sportEventPairs.length;
            updateCarouselPosition();
            triggerFireworks(); // Trigger fireworks on slide
        }

        // Initialize
        async function init() {
            matchesData = await fetchMatches();
            sportEventPairs = generateSportEventPairs(matchesData.matches);
            await setupCarousel();
        }

        // Fireworks Animation
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let fireworks = [];
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            updateCarouselPosition();
        });

        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.sx = this.x;
                this.sy = this.y;
                this.targetY = Math.random() * canvas.height * 0.5;
                this.speed = Math.random() * 3 + 2;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                this.exploded = false;
                this.particles = [];
            }

            update() {
                if (!this.exploded) {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        this.exploded = true;
                        for (let i = 0; i < 30; i++) {
                            this.particles.push(new Particle(this.x, this.y, this.color));
                        }
                    }
                }
            }

            draw() {
                if (!this.exploded) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.speed = Math.random() * 3 + 1;
                this.angle = Math.random() * Math.PI * 2;
                this.life = 100;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.02; // Gravity
                this.life -= 1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / 100;
                ctx.fill();
            }
        }

        function triggerFireworks() {
            for (let i = 0; i < 5; i++) {
                fireworks.push(new Firework());
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1;

            // Update and draw fireworks
            fireworks = fireworks.filter(f => !f.exploded);
            fireworks.forEach(firework => {
                firework.update();
                firework.draw();
                firework.particles.forEach(p => {
                    p.update();
                    p.draw();
                    if (p.life <= 0) {
                        firework.particles = firework.particles.filter(pp => pp !== p);
                    }
                });
            });

            // Update and draw particles
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.life <= 0) particles.splice(index, 1);
            });

            requestAnimationFrame(animateFireworks);
        }

        animateFireworks();

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
